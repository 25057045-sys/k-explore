<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details – K Explore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">K Explore</a>
    <nav><a href="index.html#events">← Back to Events</a></nav>
  </header>

  <main class="container">
    <section id="event-details"></section>

    <section class="form-section">
      <h2>Register for this Event</h2>
      <form id="register-form" novalidate>
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your name">
        <small class="error" id="name-error"></small>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com">
        <small class="error" id="email-error"></small>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="10-digit mobile number">
        <small class="error" id="phone-error"></small>

        <label for="event-select">Selected Event</label>
        <select id="event-select"></select>
        <small class="error" id="event-error"></small>

        <button type="submit" class="btn">Register</button>
      </form>
      <div id="confirmation" class="confirmation" hidden></div>
    </section>
  </main>

  <footer><p>&copy; 2026 K Explore</p></footer>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/event.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
